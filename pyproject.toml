[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card53"
version = "0.1.0"
description = "Quantitative research project for studying hidden market states in US equities."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "53rd Card contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "yfinance>=0.2",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
